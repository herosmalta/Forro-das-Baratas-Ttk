<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arraiá das Baratas</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,"Segoe UI",Arial,sans-serif}
  body{display:flex;justify-content:center;align-items:center}
  canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;background:#120a2a;display:block}
  #panel{position:fixed;left:10px;top:10px;width:300px;max-height:calc(100vh - 20px);overflow:auto;background:rgba(15,10,30,.93);color:#fff;border:1px solid #ffffff30;border-radius:12px;padding:12px;font-size:13px;z-index:10}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel hr{border:0;border-top:1px solid #ffffff25;margin:10px 0}
  #panel button{background:#3b2a6b;color:#fff;border:0;border-radius:8px;padding:7px 9px;margin:2px 2px 2px 0;cursor:pointer;font-size:12.5px}
  #panel button:hover{background:#5a40a3}
  #panel button.on{background:#e0662b}
  #panel input[type=text]{width:100%;box-sizing:border-box;margin:2px 0;padding:6px;border-radius:6px;border:1px solid #ffffff30;background:#1d1438;color:#fff}
  #st{padding:6px 8px;border-radius:8px;background:#ffffff15;margin-bottom:6px}
  #fps{padding:4px 8px;border-radius:8px;background:#ffffff10;margin-bottom:8px;font-size:12px;font-variant-numeric:tabular-nums}
  small{opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h3>🎛️ Painel do jogo <small>(tecla H esconde)</small></h3>
  <div id="st">⚪ Modo demo</div>
  <div id="fps">FPS …</div>
  <div>
    <button id="m_arraia" class="on">🪗 Arraiá</button>
    <button id="m_corrida">🏁 Corrida</button>
    <button id="snd">🔊 Ligar som</button>
    <button id="b_cam" class="on">🎥 Câmera: ligada</button>
  </div>
  <hr>
  <b>🧪 Simulador</b> <small>(testa sem live)</small>
  <input type="text" id="su" value="Maria" placeholder="usuário">
  <input type="text" id="sm" value="bora forró!" placeholder="mensagem">
  <div>
    <button id="b_chat">💬 Comentar</button>
    <button id="b_like">👍 +50 likes</button>
    <button id="b_follow">➕ Seguir</button>
    <button id="b_share">↗️ Share</button>
  </div>
  <div>
    <button data-g="Rose|1">🌹 Rose 1💎</button>
    <button data-g="Finger Heart|5">🫰 5💎</button>
    <button data-g="Doughnut|30">🍩 30💎</button>
    <button data-g="Lion|500">🦁 500💎</button>
    <button data-g="Universe|1500">🌌 1500💎</button>
    <button data-g="Mega|6000">💥 6000💎</button>
  </div>
  <hr>
  <b>⭐ Presentes especiais</b>
  <div>
    <button id="b_sanf">🪗 Sanfoneiro</button>
    <button id="b_noivo">🤵 Noivo</button>
    <button id="b_noiva">👰 Noiva</button>
    <button id="b_casar">💒 Casar agora</button>
  </div>
  <hr>
  <b>🔬 Teste de carga</b>
  <div>
    <button id="b_bots">🤖 +10 bots</button>
    <button id="b_bots60">🤖 +60 bots</button>
    <button id="b_spam">🌹 Chuva de 200 rosas</button>
    <button id="b_auto">▶️ Demo automática</button>
    <button id="b_reset">♻️ Reiniciar tudo</button>
  </div>
  <hr>
  <small>Chat: <b>!pular !girar !dancar !rebolar !sapatear !ola !estrela</b> · <b>!cor azul</b><br>
  Atalhos: <b>H</b> painel · <b>M</b> trocar modo · <b>C</b> câmera</small>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   CONFIGURAÇÃO — mexa aqui para personalizar a sua live
   ============================================================ */
const CONFIG = {
  tituloArraia: 'ARRAIÁ DAS BARATAS',
  tituloCorrida: 'CORRIDA DAS BARATAS',
  bpm: 128,                 // ritmo da música e da dança
  maxBaratas: 80,           // máximo de baratas dançando na tela
  maxBaratinhas: 40,        // máximo de baratinhas da "chuva"
  maxParticulas: 420,       // teto de partículas ao mesmo tempo (protege o FPS)
  likesBase: 150,           // curtidas para encher o 1º Forró Meter
  likesCrescimento: 1.3,    // cada nível pede 30% mais curtidas
  duracaoFesta: 15,         // segundos do modo "Forró On Fire"
  bloqueadas: ['palavrao1', 'palavrao2'],   // palavras trocadas por ***

  // ---- Efeito por faixa de diamantes (valor total = diamantes x quantidade)
  faixas: [
    { min: 1,    acao: 'pulo'    },   // todo mundo pula
    { min: 10,   acao: 'chuva'   },   // chuva de baratinhas
    { min: 100,  acao: 'gigante' },   // barata gigante coroada
    { min: 1000, acao: 'festa'   },   // fogos + festa total
  ],
  // ---- Efeito por NOME do presente (vale para presentes < 100 💎).
  // Ações: pulo | giro | flores | chuva | gigante | fogos | festa
  presentes: {
    'rose': 'flores', 'rosa': 'flores',
    'tiktok': 'giro',
    'finger heart': 'pulo', 'coração': 'pulo',
    'doughnut': 'chuva', 'rosquinha': 'chuva',
    'hat and mustache': 'fogos', 'chapéu': 'fogos',
  },

  // ---- PRESENTES ESPECIAIS (têm prioridade sobre as regras acima)
  // Escolha os presentes que existem na SUA live. Pode casar por:
  //   nomes     -> pedaço do nome do presente (sem diferenciar maiúsculas)
  //   ids       -> id numérico do presente
  //   diamantes -> valor de UMA unidade em diamantes (cuidado: pega todos com esse valor)
  // Dica: rode  node server.js usuario --presentes  para listar os presentes disponíveis.
  especiais: {
    sanfoneiro: { nomes: ['sanfona', 'accordion', 'sunglasses'],   ids: [], diamantes: [], duracao: 45 },
    noivo:      { nomes: ['noivo', 'groom', 'hand hearts'],        ids: [], diamantes: [], duracao: 150 },
    noiva:      { nomes: ['noiva', 'bride', 'perfume'],            ids: [], diamantes: [], duracao: 150 },
  },

  // ---- RARIDADE (pelo valor total do presente em 💎; e também pelo total doado por pessoa)
  raridades: [
    { id: 'comum',    nome: 'COMUM',    min: 1,    cor: '#cfd8dc', zoom: 1.8, hold: 1.6 },
    { id: 'raro',     nome: 'RARO',     min: 10,   cor: '#4fc3f7', zoom: 2.0, hold: 2.2 },
    { id: 'epico',    nome: 'ÉPICO',    min: 100,  cor: '#ce93d8', zoom: 2.3, hold: 3.2 },
    { id: 'lendario', nome: 'LENDÁRIO', min: 1000, cor: '#ffd54f', zoom: 2.6, hold: 4.5 },
    { id: 'mitico',   nome: 'MÍTICO',   min: 5000, cor: '#ff5252', zoom: 2.9, hold: 6.0 },
  ],
  // Emoji de cada presente (parte do nome). Os que não casarem usam o emoji da raridade.
  emojis: {
    'rose': '🌹', 'rosa': '🌹', 'tiktok': '🎵', 'finger heart': '🫰', 'doughnut': '🍩', 'lion': '🦁',
    'universe': '🌌', 'galaxy': '🌌', 'hat and mustache': '🎩', 'perfume': '🧴', 'sunglasses': '😎',
    'hand hearts': '💞', 'corgi': '🐶', 'swan': '🦢', 'sanfona': '🪗', 'accordion': '🪗',
    'noivo': '🤵', 'groom': '🤵', 'noiva': '👰', 'bride': '👰',
  },
  emojiRaridade: ['🎁', '💎', '🔮', '👑', '🌟'],

  // ---- CÂMERA
  camera: { ativa: true, fila: 5 },      // fila: máximo de presentes esperando a câmera

  // ---- COMBO (vários espectadores mandando presente juntos)
  combo: { janela: 8, niveis: [3, 5, 8, 12] },

  // ---- METAS DE CURTIDAS
  likesMini: 40,                                         // mini-comemoração a cada X curtidas
  metasCurtidas: [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000],

  // ---- Corrida
  corridaInscricao: 25,     // segundos de inscrições
  corridaVelocidade: 0.03,  // fração da pista por segundo (~33s de prova)
  maxCorredoras: 40,
};

/* ============================================================
   BASE
   ============================================================ */
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const qs = new URLSearchParams(location.search);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const short = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 14) || 'anônimo';
const FONT = '"Segoe UI",Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

let mode = qs.get('mode') === 'corrida' ? 'corrida' : 'arraia';
let time = 0, beatT = 0, partyUntil = 0, goldAllUntil = 0, flash = 0;
let Q = 2;                                   // qualidade adaptativa: 2 alta, 1 média, 0 baixa
const QS = [0.3, 0.6, 1];                    // fator de partículas por nível

const COLORS = { marrom:'#7a4524', vermelho:'#c8333b', azul:'#2f6fd6', verde:'#2e9e4f', rosa:'#e56bb0',
  roxo:'#7e4bc4', amarelo:'#d9a92a', preto:'#33333b', laranja:'#e9822b', branco:'#d8d8d8' };
const RC = Object.values(COLORS);
const HATS = ['palha','palha','palha','laco','cartola','nenhum'];
const CONF = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#ffffff'];
const RAR = CONFIG.raridades;
const rarIdx = v => { let k = 0; for (let i = 0; i < RAR.length; i++) if (v >= RAR[i].min) k = i; return k; };

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${clamp((n >> 16) + amt, 0, 255)},${clamp(((n >> 8) & 255) + amt, 0, 255)},${clamp((n & 255) + amt, 0, 255)})`;
}
function ell(g, x, y, rx, ry, fill) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fillStyle = fill; g.fill(); }
function rr(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function clean(t) {
  let s = String(t || '').replace(/https?:\/\/\S+/gi, '').replace(/\s+/g, ' ').trim().slice(0, 40);
  for (const w of CONFIG.bloqueadas) if (w) s = s.replace(new RegExp(w, 'gi'), '***');
  return s;
}

/* ---- Texto em cache: cada texto é rasterizado UMA vez (2x para ficar nítido no zoom) ---- */
const mctx = mk(4, 4).getContext('2d');
const tcache = new Map();
function T(s, x, y, size, o = {}) {
  s = String(s);
  const w = o.w || '800', a = o.a || 'center', st = o.st !== 0, lw = st ? (o.lw || Math.max(4, size / 6)) : 0, c = o.c || '#fff', sc = o.sc || 'rgba(0,0,0,.85)';
  const key = s + '|' + size + '|' + w + '|' + c + '|' + lw + '|' + sc;
  let e = tcache.get(key);
  if (!e) {
    if (tcache.size > 800) tcache.clear();
    const font = `${w} ${size * 2}px ${FONT}`; mctx.font = font;
    const tw = Math.ceil(mctx.measureText(s).width), pad = Math.ceil(lw + 6);
    const cw = tw + pad * 2, ch = Math.ceil(size * 2.8) + pad * 2;
    const cc = mk(cw, ch), g = cc.getContext('2d');
    g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (st) { g.lineWidth = lw * 2; g.strokeStyle = sc; g.lineJoin = 'round'; g.strokeText(s, cw / 2, ch / 2); }
    g.fillStyle = c; g.fillText(s, cw / 2, ch / 2);
    e = { c: cc, w: cw / 2, h: ch / 2, pad: pad / 2 }; tcache.set(key, e);
  }
  const dx = a === 'left' ? x - e.pad : a === 'right' ? x - e.w + e.pad : x - e.w / 2;
  ctx.drawImage(e.c, dx, y - e.h / 2, e.w, e.h);
}

/* ---- Emojis em sprite (nunca mais fillText de emoji por partícula) ---- */
const emoList = [], emoIdx = new Map();
function emoId(t) {
  let i = emoIdx.get(t);
  if (i === undefined) {
    const c = mk(80, 80), g = c.getContext('2d');
    g.font = `56px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, 40, 44);
    i = emoList.length; emoList.push(c); emoIdx.set(t, i);
  }
  return i;
}
function drawEmo(t, x, y, size, rot, alpha) {
  const c = emoList[emoId(t)];
  ctx.save(); if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.translate(x, y); if (rot) ctx.rotate(rot);
  ctx.drawImage(c, -size / 2, -size / 2, size, size); ctx.restore();
}

/* ---- Sprites pequenos reutilizados ---- */
const confSpr = CONF.map(col => { const c = mk(20, 10); const g = c.getContext('2d'); g.fillStyle = col; g.fillRect(0, 0, 20, 10); return c; });
const puffSpr = (() => { const c = mk(64, 64), g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 2, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,.95)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c; })();
const glowSpr = (col) => { const c = mk(256, 256), g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 4, 128, 128, 128);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return c; };
const fireGlow = glowSpr('rgba(255,160,50,.55)');
const goldGlow = glowSpr('rgba(255,215,64,.75)');
const loveGlow = glowSpr('rgba(255,120,190,.7)');
const vignette = (() => { const c = mk(270, 480), g = c.getContext('2d'); const gr = g.createRadialGradient(135, 240, 90, 135, 240, 330);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = gr; g.fillRect(0, 0, 270, 480); return c; })();

/* ============================================================
   CENÁRIO PRÉ-RENDERIZADO (camadas para o parallax)
   ============================================================ */
const HORIZON = 780;
// Camada distante: céu, lua, casinhas (move menos que o chão quando a câmera chega perto)
const bgFar = mk(W, 1400);
(function () {
  const g = bgFar.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, HORIZON + 20);
  gr.addColorStop(0, '#130a30'); gr.addColorStop(.6, '#4a2468'); gr.addColorStop(1, '#d4607a');
  g.fillStyle = gr; g.fillRect(0, 0, W, HORIZON + 20);
  g.fillStyle = '#fff';
  for (let i = 0; i < 140; i++) { g.globalAlpha = rand(.3, 1); g.beginPath(); g.arc(rand(0, W), rand(0, 600), rand(.8, 2.4), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  g.fillStyle = '#f6efc9'; g.beginPath(); g.arc(900, 250, 62, 0, 7); g.fill();
  g.fillStyle = '#e4dba8'; [[880,235,12],[918,268,9],[895,275,7]].forEach(c => { g.beginPath(); g.arc(c[0], c[1], c[2], 0, 7); g.fill(); });
  for (let i = 0; i < 9; i++) {
    const x = i * 130 - 20, w = rand(90, 120), h = rand(70, 120);
    g.fillStyle = '#1e1035'; g.fillRect(x, HORIZON - h, w, h);
    g.beginPath(); g.moveTo(x - 8, HORIZON - h); g.lineTo(x + w / 2, HORIZON - h - 46); g.lineTo(x + w + 8, HORIZON - h); g.fill();
    g.fillStyle = '#ffd36b';
    for (let k = 0; k < 2; k++) if (Math.random() > .3) g.fillRect(x + 14 + k * 42, HORIZON - h + 22, 22, 26);
  }
  g.fillStyle = '#5a3820'; g.fillRect(0, HORIZON, W, 620);      // faixa de terra (cobre folgas do parallax)
})();
// Camada próxima: chão de madeira com perspectiva (linhas convergindo para o horizonte)
const bgNear = mk(W, H - HORIZON);
(function () {
  const g = bgNear.getContext('2d'), h = H - HORIZON;
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#6b4524'); gr.addColorStop(1, '#3b2212');
  g.fillStyle = gr; g.fillRect(0, 0, W, h);
  g.strokeStyle = 'rgba(0,0,0,.30)'; g.lineWidth = 3;
  // tábuas horizontais: espaçamento cresce com a proximidade
  for (let k = 0, y = 0, d = 18; y < h; k++, y += d, d *= 1.16) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // linhas de fuga
  for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(540 + i * 28, 0); g.lineTo(540 + i * 190, h); g.stroke(); }
  // brilho do palco e sombra de profundidade no topo
  const sh = g.createLinearGradient(0, 0, 0, 120); sh.addColorStop(0, 'rgba(0,0,0,.35)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(0, 0, W, 120);
})();
const stageSpr = (() => {
  const c = mk(480, 90), g = c.getContext('2d');
  g.fillStyle = '#a56a38'; g.fillRect(0, 0, 480, 70); g.fillStyle = '#7d4b24'; g.fillRect(0, 55, 480, 22);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 0, 480, 8); return c;
})();
// Arco de flores do casamento
const archSpr = (() => {
  const c = mk(420, 470), g = c.getContext('2d');
  g.strokeStyle = '#7a5230'; g.lineWidth = 16; g.lineCap = 'round';
  g.beginPath(); g.moveTo(40, 460); g.lineTo(40, 200); g.ellipse(210, 200, 170, 170, 0, Math.PI, TAU); g.lineTo(380, 460); g.stroke();
  const cols = ['#ffffff', '#ffc2d9', '#ff8fb8', '#d7f5d0', '#fff2a8'];
  for (let i = 0; i < 90; i++) {
    const a = Math.PI + (i / 89) * Math.PI, x = 210 + Math.cos(a) * 170 + rand(-14, 14), y = 200 + Math.sin(a) * 170 + rand(-14, 14);
    g.fillStyle = pick(cols); g.beginPath(); g.arc(x, y, rand(7, 15), 0, TAU); g.fill();
  }
  for (let s = 0; s < 2; s++) for (let i = 0; i < 16; i++) {
    g.fillStyle = pick(cols); g.beginPath(); g.arc(s ? 380 + rand(-12, 12) : 40 + rand(-12, 12), 200 + i * 16, rand(6, 12), 0, TAU); g.fill();
  }
  g.fillStyle = '#6fbf73'; for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(210 + Math.cos(Math.PI + i / 39 * Math.PI) * 170, 200 + Math.sin(Math.PI + i / 39 * Math.PI) * 170, 5, 0, TAU); g.fill(); }
  return c;
})();
const FINISH_Y = 520, START_Y = 1660;
const bgR = mk(W, H);
(function () {
  const g = bgR.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 520);
  gr.addColorStop(0, '#0e1a3d'); gr.addColorStop(1, '#2d4a7a');
  g.fillStyle = gr; g.fillRect(0, 0, W, 520);
  g.fillStyle = '#fff';
  for (let i = 0; i < 80; i++) { g.globalAlpha = rand(.3, 1); g.beginPath(); g.arc(rand(0, W), rand(0, 330), rand(.8, 2.2), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  gr = g.createLinearGradient(0, 480, 0, H);
  gr.addColorStop(0, '#6b4d2e'); gr.addColorStop(1, '#3d2b18');
  g.fillStyle = gr; g.fillRect(0, 480, W, H - 480);
  for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(0,0,0,${rand(.04, .14)})`; g.fillRect(rand(0, W), rand(480, H), rand(3, 9), rand(2, 5)); }
  for (let r = 0; r < 2; r++) for (let c = 0; c < 36; c++) { g.fillStyle = (r + c) % 2 ? '#111' : '#fff'; g.fillRect(c * 30, FINISH_Y - 30 + r * 30, 30, 30); }
  g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(0, START_Y + 20, W, 8);
})();
// Bandeirinhas: camada própria, redesenhada só ~8x/s (e não 60x/s)
const buntCv = mk(W, 190); let buntStamp = -1;
function drawBunting(g, y0, amp, off) {
  const flags = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff924c'];
  const ry = x => y0 + amp * Math.sin(Math.PI * (((x + off) % 540) / 540));
  g.strokeStyle = '#e8dcc0'; g.lineWidth = 3; g.beginPath();
  for (let x = -10; x <= W + 10; x += 20) { const y = ry(x); x === -10 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
  let i = 0;
  for (let x = 20; x < W; x += 54, i++) {
    const y = ry(x), sw = Math.sin(time * 2 + i) * 4;
    g.fillStyle = flags[i % flags.length]; g.beginPath(); g.moveTo(x - 20, y); g.lineTo(x + 20, y); g.lineTo(x + sw, y + 46); g.closePath(); g.fill();
  }
}
function refreshBunting() {
  const st = Math.floor(time * (Q === 2 ? 8 : 3)); if (st === buntStamp) return; buntStamp = st;

  r = base({ user, name: short(name || user), p: 0, boost: 0, slow: 0, sm: rand(.92, 1.08), cool: 0, size: .5, noDepth: true, x: 0, y: START_Y });
  race.racers.push(r); race.map.set(user, r); return r;
}

function raceUpdate(dt) {

  } else if (race.state === 'countdown') {
    if (time >= race.cdEnd) { race.state = 'run'; race.startedAt = time; banner('🏁 VALENDO!', 'Comenta, curte e manda presente pra acelerar!', '#8ac926'); }
  } else if (race.state === 'run') {
    let lead = null;
    for (const r of race.racers) {
      r.sm = clamp(r.sm + rand(-.6, .6) * dt, .85, 1.15);
      let v = CONFIG.corridaVelocidade * r.sm;
      if (r.boost > 0) { v *= 2.6; r.boost -= dt; }
      if (r.slow > 0) { v *= .35; r.slow -= dt; }
      r.p += v * dt; r.cool -= dt;
      if (!lead || r.p > lead.p) lead = r;
    }
    if (lead && (lead.p >= 1 || time - race.startedAt > 120)) {
      lead.p = 1; race.winner = lead; race.state = 'finish'; race.finEnd = time + 10;
      race.wins.set(lead.user, { name: lead.name, w: (race.wins.get(lead.user)?.w || 0) + 1 });
      fireworks(8); conf(140); banner(`🏆 ${lead.name} VENCEU!`, 'Parabéns, campeã das baratas!', '#ffd54a', true); sfx('party');
    }
  } else if (race.state === 'finish') {

}

let lastGiftFx = 0, dropped = 0;

  switch (e.type) {

    case 'chat': if (chatQ.length < 150) chatQ.push(e); else dropped++; break;
    case 'like': { const k = e.user || '_'; const a = likeAcc.get(k); if (a) a.likes += Math.max(1, e.likes | 0); else likeAcc.set(k, { user: e.user, name: e.name, likes: Math.max(1, e.likes | 0) }); break; }

    case 'follow': case 'share': if (miscQ.length < 40) miscQ.push(e); break;
  }
}

  e.count = Math.max(1, e.count | 0); e.diamonds = Math.max(1, e.diamonds | 0);
  e.total = e.diamonds * e.count; e.tier = rarIdx(e.total);
  const g = gifters.get(e.user) || { name: short(e.name || e.user), d: 0 }; g.d += e.total; gifters.set(e.user, g);
  recomputeRank();

  comboHit(e.user);
  const last = giftQ[giftQ.length - 1];
  if (last && last.user === e.user && last.gift === e.gift) { last.count += e.count; last.total += e.total; last.tier = Math.max(last.tier, rarIdx(last.total)); }   // junta rajadas iguais
  else giftQ.push(e);

    giftQ.sort((a, b) => b.total - a.total); dropped += giftQ.length - 15; giftQ.length = 15;

}

let last = performance.now(), ema = 16.7, qTimer = 0, goodT = 0, fpsT = 0;
const fpsEl = document.getElementById('fps');
function loop(now) {
  const raw = now - last, dt = Math.min(.05, raw / 1000); last = now;
  ema += (raw - ema) * .05;
  update(dt); render();
  qTimer += dt; fpsT += dt;
  if (qTimer >= 1) {          // ajusta a qualidade sozinho para manter o FPS estável
    qTimer = 0; const fps = 1000 / ema;
    if (fps < 42 && Q > 0) { Q--; goodT = 0; }
    else if (fps > 57) { goodT++; if (goodT >= 10 && Q < 2) { Q++; goodT = 0; } } else goodT = 0;
  }
  if (fpsT >= .5) { fpsT = 0; fpsEl.textContent = `FPS ${Math.round(1000 / ema)} · qualidade ${['baixa', 'média', 'alta'][Q]} · partículas ${pn} · baratas ${crowd.size + minis.length} · fila ${giftQ.length}/${camQ.length}`; }
  requestAnimationFrame(loop);
}

/* ============================================================
   CONEXÃO COM O SERVIDOR (SSE) + PAINEL
   ============================================================ */
const stEl = document.getElementById('st');
function setStatus(t, ok) { stEl.textContent = (ok ? '🟢 ' : '🟠 ') + t; }
function connect() {
  const base = qs.get('server') || (location.protocol.startsWith('http') ? '' : null);
  if (base === null) { stEl.textContent = '⚪ Modo demo (abra pelo servidor para ligar na live)'; return; }
  const es = new EventSource(base + '/events');
  es.onopen = () => setStatus('Conectado ao servidor', true);
  es.onmessage = ev => { try { const d = JSON.parse(ev.data); if (Array.isArray(d)) for (const e of d) ingest(e); else ingest(d); } catch (_) {} };
  es.onerror = () => setStatus('Sem servidor — tentando reconectar…', false);
}
function setMode(m) {
  mode = m; if (m === 'corrida' && !race.racers.length) raceReset();
  document.getElementById('m_arraia').classList.toggle('on', m === 'arraia');
  document.getElementById('m_corrida').classList.toggle('on', m === 'corrida');
  camCur = null; camQ.length = 0;
}
const NAMES = ['Ana', 'Beto', 'Carla', 'Duda', 'Edu', 'Fabi', 'Gui', 'Helena', 'Igor', 'Jade', 'Kaio', 'Lara', 'Marcos', 'Nina', 'Otávio', 'Paula', 'Rafa', 'Sara', 'Téo', 'Vivi'];
const MSGS = ['forró!', 'tô aqui', '!pular', '!girar', '!cor azul', '!cor rosa', 'bora!', '👏👏', 'salve', 'kkkkk', 'sanfoneiro monstro', '!dancar', '!rebolar', '!ola', '!sapatear', '!estrela'];
const sim = {
  user: () => document.getElementById('su').value.trim() || 'Maria',
  chat(u, m) { ingest({ type: 'chat', user: u, name: u, text: m }); },
  gift(u, g, d, c) { ingest({ type: 'gift', user: u, name: u, gift: g, diamonds: d, count: c || 1 }); },
};
const espNome = k => CONFIG.especiais[k].nomes[0];
let autoT = null;
function autoTick() {
  const u = pick(NAMES) + ((Math.random() * 6) | 0), r = Math.random();
  if (r < .58) sim.chat(u, pick(MSGS));
  else if (r < .76) ingest({ type: 'like', user: u, name: u, likes: (Math.random() * 20 + 5) | 0 });
  else if (r < .87) sim.gift(u, 'Rose', 1, 1 + ((Math.random() * 3) | 0));
  else if (r < .92) ingest({ type: 'follow', user: u, name: u });
  else if (r < .955) sim.gift(u, 'Doughnut', 30, 1);
  else if (r < .975) sim.gift(u, espNome(pick(['sanfoneiro', 'noivo', 'noiva'])), 20, 1);
  else if (r < .99) sim.gift(u, 'Lion', 500, 1);
  else sim.gift(u, 'Universe', 1500, 1);
}
const $ = id => document.getElementById(id);
$('m_arraia').onclick = () => setMode('arraia');
$('m_corrida').onclick = () => setMode('corrida');
$('snd').onclick = () => audioOn ? stopAudio() : startAudio();
$('b_cam').onclick = () => toggleCam();
function toggleCam() { camOn = !camOn; if (!camOn) { camQ.length = 0; camCur = null; } $('b_cam').classList.toggle('on', camOn); $('b_cam').textContent = '🎥 Câmera: ' + (camOn ? 'ligada' : 'desligada'); }
$('b_chat').onclick = () => sim.chat(sim.user(), $('sm').value);
$('b_like').onclick = () => ingest({ type: 'like', user: sim.user(), name: sim.user(), likes: 50 });
$('b_follow').onclick = () => ingest({ type: 'follow', user: sim.user(), name: sim.user() });
$('b_share').onclick = () => ingest({ type: 'share', user: sim.user(), name: sim.user() });
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const [g, d] = b.dataset.g.split('|'); sim.gift(sim.user(), g, +d, 1); });
$('b_sanf').onclick = () => sim.gift(sim.user(), espNome('sanfoneiro'), 20, 1);
$('b_noivo').onclick = () => sim.gift(sim.user() || 'Noivo', espNome('noivo'), 20, 1);
$('b_noiva').onclick = () => sim.gift('Noiva_' + sim.user(), espNome('noiva'), 20, 1);
$('b_casar').onclick = () => {
  setMode('arraia');
  if (!specials.noivo) sim.gift('Noivo_Teo', espNome('noivo'), 20, 1);
  if (!specials.noiva) sim.gift('Noiva_Ana', espNome('noiva'), 20, 1);
  later(1.2, () => { wedding.cool = 0; wedding.married = false; });
};
const bots = n => { for (let i = 0; i < n; i++) later(i * .05, () => sim.chat(pick(NAMES) + ((Math.random() * 999) | 0), pick(MSGS))); };
$('b_bots').onclick = () => bots(10);
$('b_bots60').onclick = () => bots(60);
$('b_spam').onclick = () => { for (let i = 0; i < 200; i++) later(i * .01, () => sim.gift(pick(NAMES) + ((Math.random() * 40) | 0), 'Rose', 1, 1 + ((Math.random() * 5) | 0))); };
$('b_auto').onclick = e => {
  if (autoT) { clearInterval(autoT); autoT = null; e.target.classList.remove('on'); e.target.textContent = '▶️ Demo automática'; }
  else { autoT = setInterval(autoTick, 650); e.target.classList.add('on'); e.target.textContent = '⏸️ Parar demo'; }
};
$('b_reset').onclick = () => {
  crowd.clear(); minis.length = 0; boss = null; gifters.clear(); rankMap = new Map(); rankList = []; feed.length = 0; pn = 0; meter.lvl = 0; meter.v = 0; totalLikes = 0; miniAcc = 0; metaIdx = 0;
  partyUntil = 0; goldAllUntil = 0; race.wins.clear(); race.round = 1; raceReset(); specials.noivo = specials.noiva = null;
  wedding.state = 'idle'; wedding.married = false; wedding.cool = 0; musicMode = 'forro'; camQ.length = 0; camCur = null; giftQ.length = 0; chatQ.length = 0; likeAcc.clear(); banners.length = 0; curB = null; comboHits.length = 0; comboLevel = 0;
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'h') { const p = $('panel'); p.style.display = p.style.display === 'none' ? '' : 'none'; }
  if (k === 'm') setMode(mode === 'arraia' ? 'corrida' : 'arraia');
  if (k === 'c') toggleCam();
});
if (qs.get('panel') === '0') $('panel').style.display = 'none';
if (qs.get('som') === '1') { try { startAudio(); } catch (_) {} addEventListener('pointerdown', () => { if (!audioOn) startAudio(); }, { once: true }); }
window.__arraia = { ingest, get stats() { return { pn, crowd: crowd.size, minis: minis.length, giftQ: giftQ.length, camQ: camQ.length, Q, wedding: wedding.state, married: wedding.married, cam: { ...cam }, camCur: camCur && camCur.name, specials: Object.keys(specials).filter(k => specials[k]), level: comboLevel, likes: totalLikes, meta: metaIdx }; } };

raceReset();
setMode(mode);
connect();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
