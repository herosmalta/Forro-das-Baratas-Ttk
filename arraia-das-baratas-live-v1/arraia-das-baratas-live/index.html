<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arraiá das Baratas</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,"Segoe UI",Arial,sans-serif}
  body{display:flex;justify-content:center;align-items:center}
  canvas{height:min(100vh,calc(100vw*16/9));aspect-ratio:9/16;background:#120a2a;display:block}
  #panel{position:fixed;left:10px;top:10px;width:290px;max-height:calc(100vh - 20px);overflow:auto;background:rgba(15,10,30,.93);color:#fff;border:1px solid #ffffff30;border-radius:12px;padding:12px;font-size:13px;z-index:10}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel hr{border:0;border-top:1px solid #ffffff25;margin:10px 0}
  #panel button{background:#3b2a6b;color:#fff;border:0;border-radius:8px;padding:7px 9px;margin:2px 2px 2px 0;cursor:pointer;font-size:12.5px}
  #panel button:hover{background:#5a40a3}
  #panel button.on{background:#e0662b}
  #panel input[type=text]{width:100%;box-sizing:border-box;margin:2px 0;padding:6px;border-radius:6px;border:1px solid #ffffff30;background:#1d1438;color:#fff}
  #st{padding:6px 8px;border-radius:8px;background:#ffffff15;margin-bottom:8px}
  small{opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h3>🎛️ Painel do jogo <small>(tecla H esconde)</small></h3>
  <div id="st">⚪ Modo demo</div>
  <div>
    <button id="m_arraia" class="on">🪗 Arraiá</button>
    <button id="m_corrida">🏁 Corrida</button>
    <button id="snd">🔊 Ligar som</button>
  </div>
  <hr>
  <b>🧪 Simulador</b> <small>(testa sem live)</small>
  <input type="text" id="su" value="Maria" placeholder="usuário">
  <input type="text" id="sm" value="bora forró!" placeholder="mensagem">
  <div>
    <button id="b_chat">💬 Comentar</button>
    <button id="b_like">👍 +50 likes</button>
    <button id="b_follow">➕ Seguir</button>
    <button id="b_share">↗️ Share</button>
  </div>
  <div>
    <button data-g="Rose|1">🌹 Rose 1💎</button>
    <button data-g="Finger Heart|5">🫰 5💎</button>
    <button data-g="Doughnut|30">🍩 30💎</button>
    <button data-g="Lion|500">🦁 500💎</button>
    <button data-g="Universe|1500">🌌 1500💎</button>
  </div>
  <div>
    <button id="b_bots">🤖 +10 bots</button>
    <button id="b_auto">▶️ Demo automática</button>
    <button id="b_reset">♻️ Reiniciar tudo</button>
  </div>
  <hr>
  <small>Comandos do chat: <b>!pular</b> <b>!girar</b> <b>!dancar</b> <b>!cor azul</b><br>
  Atalhos: <b>H</b> painel · <b>M</b> trocar modo</small>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   CONFIGURAÇÃO — mexa aqui para personalizar a sua live
   ============================================================ */
const CONFIG = {
  tituloArraia: 'ARRAIÁ DAS BARATAS',
  tituloCorrida: 'CORRIDA DAS BARATAS',
  bpm: 128,                 // ritmo da música e da dança
  maxBaratas: 90,           // máximo de baratas dançando na tela
  likesBase: 150,           // curtidas para encher o 1º Forró Meter
  likesCrescimento: 1.3,    // cada nível pede 30% mais curtidas
  duracaoFesta: 15,         // segundos do modo "Forró On Fire"
  bloqueadas: ['palavrao1', 'palavrao2'],   // palavras trocadas por ***

  // Efeito por faixa de diamantes (valor total = diamantes x quantidade)
  faixas: [
    { min: 1,    acao: 'pulo'    },   // todo mundo pula
    { min: 10,   acao: 'chuva'   },   // chuva de baratinhas
    { min: 100,  acao: 'gigante' },   // barata gigante coroada
    { min: 1000, acao: 'festa'   },   // fogos + festa total
  ],
  // Efeito por NOME do presente (vale para presentes < 100 💎).
  // Ações: pulo | giro | flores | chuva | gigante | fogos | festa
  presentes: {
    'rose': 'flores', 'rosa': 'flores',
    'tiktok': 'giro',
    'finger heart': 'pulo', 'coração': 'pulo',
    'doughnut': 'chuva', 'rosquinha': 'chuva',
    'hat and mustache': 'fogos', 'chapéu': 'fogos',
  },

  // Corrida
  corridaInscricao: 25,     // segundos de inscrições
  corridaVelocidade: 0.03,  // fração da pista por segundo (~33s de prova)
  maxCorredoras: 40,
};

/* ============================================================
   BASE
   ============================================================ */
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const qs = new URLSearchParams(location.search);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const short = s => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 14) || 'anônimo';
const FONT = '"Segoe UI",Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

let mode = qs.get('mode') === 'corrida' ? 'corrida' : 'arraia';
let time = 0, beatT = 0, partyUntil = 0, goldAllUntil = 0;

const COLORS = { marrom:'#7a4524', vermelho:'#c8333b', azul:'#2f6fd6', verde:'#2e9e4f', rosa:'#e56bb0',
  roxo:'#7e4bc4', amarelo:'#d9a92a', preto:'#33333b', laranja:'#e9822b', branco:'#d8d8d8' };
const RC = Object.values(COLORS);
const HATS = ['palha','palha','palha','laco','cartola','nenhum'];
const CONF = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#ffffff'];

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
function T(s, x, y, size, o = {}) {
  ctx.font = `${o.w || '800'} ${size}px ${FONT}`;
  ctx.textAlign = o.a || 'center'; ctx.textBaseline = 'middle';
  if (o.st !== 0) { ctx.lineWidth = o.lw || Math.max(4, size / 6); ctx.strokeStyle = o.sc || 'rgba(0,0,0,.85)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.c || '#fff'; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ell(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.2832); ctx.fillStyle = fill; ctx.fill(); }
function clean(t) {
  let s = String(t || '').replace(/https?:\/\/\S+/gi, '').replace(/\s+/g, ' ').trim().slice(0, 40);
  for (const w of CONFIG.bloqueadas) if (w) s = s.replace(new RegExp(w, 'gi'), '***');
  return s;
}

/* ============================================================
   FUNDOS PRÉ-RENDERIZADOS
   ============================================================ */
function makeCanvas() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

const bgA = makeCanvas();
(function () {
  const g = bgA.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 800);
  gr.addColorStop(0, '#130a30'); gr.addColorStop(.6, '#4a2468'); gr.addColorStop(1, '#d4607a');
  g.fillStyle = gr; g.fillRect(0, 0, W, 800);
  g.fillStyle = '#fff';
  for (let i = 0; i < 140; i++) { g.globalAlpha = rand(.3, 1); g.beginPath(); g.arc(rand(0, W), rand(0, 600), rand(.8, 2.4), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  g.fillStyle = '#f6efc9'; g.beginPath(); g.arc(900, 250, 62, 0, 7); g.fill();
  g.fillStyle = '#e4dba8'; [[880,235,12],[918,268,9],[895,275,7]].forEach(c => { g.beginPath(); g.arc(c[0], c[1], c[2], 0, 7); g.fill(); });
  // casinhas ao fundo
  for (let i = 0; i < 9; i++) {
    const x = i * 130 - 20, w = rand(90, 120), h = rand(70, 120);
    g.fillStyle = '#1e1035'; g.fillRect(x, 780 - h, w, h);
    g.beginPath(); g.moveTo(x - 8, 780 - h); g.lineTo(x + w / 2, 780 - h - 46); g.lineTo(x + w + 8, 780 - h); g.fill();
    g.fillStyle = '#ffd36b';
    for (let k = 0; k < 2; k++) if (Math.random() > .3) g.fillRect(x + 14 + k * 42, 780 - h + 22, 22, 26);
  }
  // chão de madeira
  gr = g.createLinearGradient(0, 780, 0, H);
  gr.addColorStop(0, '#7a4e2a'); gr.addColorStop(1, '#3b2212');
  g.fillStyle = gr; g.fillRect(0, 780, W, H - 780);
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 3;
  for (let y = 780, row = 0; y < H; y += 64, row++) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    for (let x = (row % 2) * 120; x < W; x += 240) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 64); g.stroke(); }
  }
  // palco
  g.fillStyle = '#a56a38'; g.fillRect(300, 735, 480, 70);
  g.fillStyle = '#7d4b24'; g.fillRect(300, 790, 480, 22);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(300, 735, 480, 8);
})();

const FINISH_Y = 520, START_Y = 1660;
const bgR = makeCanvas();
(function () {
  const g = bgR.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 520);
  gr.addColorStop(0, '#0e1a3d'); gr.addColorStop(1, '#2d4a7a');
  g.fillStyle = gr; g.fillRect(0, 0, W, 520);
  g.fillStyle = '#fff';
  for (let i = 0; i < 80; i++) { g.globalAlpha = rand(.3, 1); g.beginPath(); g.arc(rand(0, W), rand(0, 330), rand(.8, 2.2), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  gr = g.createLinearGradient(0, 480, 0, H);
  gr.addColorStop(0, '#6b4d2e'); gr.addColorStop(1, '#3d2b18');
  g.fillStyle = gr; g.fillRect(0, 480, W, H - 480);
  for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(0,0,0,${rand(.04, .14)})`; g.fillRect(rand(0, W), rand(480, H), rand(3, 9), rand(2, 5)); }
  // chegada quadriculada
  for (let r = 0; r < 2; r++) for (let c = 0; c < 36; c++) { g.fillStyle = (r + c) % 2 ? '#111' : '#fff'; g.fillRect(c * 30, FINISH_Y - 30 + r * 30, 30, 30); }
  g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(0, START_Y + 20, W, 8);
})();

/* ============================================================
   ESTADO
   ============================================================ */
const crowd = new Map();      // arraiá: usuário -> barata
let minis = [];               // baratinhas da chuva
let boss = null;              // barata gigante
const gifters = new Map();    // usuário -> {name,d}
const meter = { lvl: 0, v: 0 };
const feed = [];
const parts = [];
const timers = [];
const banners = []; let curB = null;
const fireplaceA = { x: 110, y: 1560 }, fireplaceB = { x: 970, y: 1560 };
const FLOOR = { x0: 110, x1: 970, y0: 850, y1: 1640 };

const race = { state: 'lobby', racers: [], map: new Map(), pending: new Map(), wins: new Map(), winner: null, round: 1, lobbyEnd: 0, cdEnd: 0, finEnd: 0, startedAt: 0 };

function base(o) {
  return Object.assign({ ph: Math.random(), color: pick(RC), hat: pick(HATS), gold: false, dance: 'forro', danceUntil: 0,
    crownUntil: 0, bubble: '', bubbleT: 0, name: '', user: '' }, o);
}
function later(dt, fn) { timers.push({ at: time + dt, fn }); }
function banner(t, sub, color) { banners.push({ t, sub: sub || '', color: color || '#ffd54a' }); if (banners.length > 6) banners.shift(); }
function addFeed(s) { feed.unshift({ s, t: time }); if (feed.length > 5) feed.pop(); }

/* ============================================================
   ÁUDIO (sintetizado — sem arquivos externos)
   ============================================================ */
let ac = null, master = null, audioOn = false, nextStep = 0, step = 0, sched = null;
const SCALE = [0, 2, 4, 5, 7, 9, 11];
const PHR = [
  [0,2,4,2,0,-1,0,null, 2,4,5,4,2,0,2,null],
  [4,5,7,5,4,2,4,null, 2,0,2,4,2,0,-1,null],
];
const midi = d => 60 + SCALE[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(type, f, t, dur, vol, lp) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = o;
  if (lp) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
  node.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function playStep(s, t) {
  const b = s % 8;
  if ([0, 3, 4, 7].includes(b)) { // zabumba
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(48, t + .14);
    g.gain.setValueAtTime(.8, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .25);
  }
  tone('square', 4200, t, .035, b % 2 === 0 ? .05 : .025);            // triângulo
  const ph = PHR[Math.floor(s / 16) % 2][s % 16];                      // sanfona
  if (ph !== null) tone('sawtooth', hz(midi(ph)), t, .24, .09, 2200);
}
function startAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination);
    nextStep = ac.currentTime + .1; step = 0; beatT = -.1;
    sched = setInterval(() => {
      if (!audioOn) return;
      const sd = 60 / CONFIG.bpm / 2;
      while (nextStep < ac.currentTime + .15) { playStep(step, nextStep); nextStep += sd; step = (step + 1) % 32; }
    }, 25);
  }
  ac.resume(); audioOn = true; master.gain.value = .5;
  document.getElementById('snd').textContent = '🔇 Desligar som';
}
function stopAudio() { audioOn = false; if (master) master.gain.value = 0; document.getElementById('snd').textContent = '🔊 Ligar som'; }
function sfx(kind) {
  if (!ac || !audioOn) return;
  const t = ac.currentTime + .02;
  const arp = kind === 'party' ? [0, 2, 4, 7, 9, 11, 14] : kind === 'big' ? [0, 4, 7, 11, 14] : [0, 4, 7];
  arp.forEach((d, i) => tone('triangle', hz(72 + d), t + i * .07, .25, .12));
}

/* ============================================================
   PARTÍCULAS E EFEITOS
   ============================================================ */
function conf(n) { for (let i = 0; i < n; i++) parts.push({ k: 'c', x: rand(0, W), y: rand(-300, -20), vx: rand(-60, 60), vy: rand(160, 360), r: rand(0, 6), vr: rand(-6, 6), c: pick(CONF), life: 7, w: rand(10, 18) }); }
function emojiRain(e, n) { for (let i = 0; i < n; i++) parts.push({ k: 'e', txt: e, x: rand(0, W), y: rand(-400, -30), vx: rand(-40, 40), vy: rand(200, 380), r: 0, vr: rand(-3, 3), life: 8, w: rand(40, 76) }); }
function burst(x, y) {
  const c = pick(CONF);
  for (let i = 0; i < 70; i++) { const a = rand(0, 6.283), sp = rand(120, 520); parts.push({ k: 's', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.9, 1.6), max: 1.6, c, g: 260 }); }
}
function fireworks(n) { for (let i = 0; i < n; i++) later(i * .45 + rand(0, .3), () => burst(rand(150, 930), rand(250, 800))); }
function startParty() {
  partyUntil = time + CONFIG.duracaoFesta; conf(120); fireworks(4);
  banner('🔥 FORRÓ ON FIRE! 🔥', 'As curtidas encheram o forró!', '#ff6b35'); sfx('party');
}
const target = () => Math.round(CONFIG.likesBase * Math.pow(CONFIG.likesCrescimento, meter.lvl));
function addLikes(n) { meter.v += n; while (meter.v >= target()) { meter.v -= target(); meter.lvl++; startParty(); } }

/* ============================================================
   ARRAIÁ — lógica
   ============================================================ */
function spawnCrowd(user, name) {
  const tx = rand(FLOOR.x0, FLOOR.x1);
  return base({ user, name: short(name || user), x: tx, y: -160, tx, ty: rand(FLOOR.y0, FLOOR.y1), size: rand(.55, .72),
    drop: true, walk: rand(25, 55), next: time + rand(2, 6), vip: false });
}
function getCrowd(user, name) {
  let r = crowd.get(user);
  if (!r) {
    if (crowd.size >= CONFIG.maxBaratas) for (const [k, v] of crowd) if (!v.vip) { crowd.delete(k); break; }
    r = spawnCrowd(user, name); crowd.set(user, r);
  }
  return r;
}
function moveRoach(r, dt) {
  const dx = r.tx - r.x, dy = r.ty - r.y, d = Math.hypot(dx, dy), sp = r.drop ? 900 : r.walk;
  if (d < 6) {
    r.drop = false;
    if (time > r.next) { r.tx = rand(FLOOR.x0, FLOOR.x1); r.ty = rand(FLOOR.y0, FLOOR.y1); r.next = time + rand(3, 9); }
  } else { const k = Math.min(d, sp * dt) / d; r.x += dx * k; r.y += dy * k; }
}
function allDance(d, sec) { for (const r of crowd.values()) { r.dance = d; r.danceUntil = time + sec; } for (const m of minis) { m.dance = d; m.danceUntil = time + sec; } }
function spawnMinis(n) {
  for (let i = 0; i < n; i++) later(i * .06, () => {
    const tx = rand(FLOOR.x0 - 40, FLOOR.x1 + 40);
    minis.push(base({ x: tx, y: -80, tx, ty: rand(FLOOR.y0, FLOOR.y1), size: rand(.28, .4), drop: true, walk: rand(30, 60), next: time + rand(1, 4), life: time + 25 }));
  });
}
function pickAction(giftName, total) {
  const n = String(giftName || '').toLowerCase();
  let a = 'pulo';
  for (const f of CONFIG.faixas) if (total >= f.min) a = f.acao;
  if (total < 100) for (const k in CONFIG.presentes) if (n.includes(k)) return CONFIG.presentes[k];
  return a;
}
function runAction(a, e, total, r) {
  const nm = short(e.name || e.user), head = `🎁 ${nm} mandou ${e.gift}${e.count > 1 ? ' x' + e.count : ''}`;
  switch (a) {
    case 'giro': allDance('girar', 7); banner(head, 'Todo mundo girando! 🌀'); break;
    case 'flores': emojiRain('🌹', 40); r.crownUntil = time + 25; banner(head, 'Chuva de flores! 🌹'); break;
    case 'chuva': spawnMinis(clamp(8 + Math.floor(total / 2), 8, 40)); r.crownUntil = time + 30; banner(head, 'Chuva de baratinhas! 🪳'); break;
    case 'gigante': boss = { name: nm, t0: time, dur: 25 }; r.vip = true; r.gold = true; fireworks(3); banner(head, 'BARATA GIGANTE CHEGOU! 👑', '#ffb703'); sfx('big'); break;
    case 'fogos': fireworks(6); r.crownUntil = time + 30; banner(head, 'Fogos de artifício! 🎆'); break;
    case 'festa': goldAllUntil = time + 25; startParty(); fireworks(10); boss = { name: nm, t0: time, dur: 30 }; r.vip = true; r.gold = true; banner(head, '🎉 FESTA TOTAL! 🎉', '#ff4d6d'); sfx('big'); break;
    default: allDance('pular', 6); r.crownUntil = time + 25; banner(head, 'Todo mundo pulando! 🦘');
  }
}

/* ============================================================
   CORRIDA — lógica
   ============================================================ */
function raceReset() {
  const queued = [...race.pending.values()];
  race.racers = []; race.map.clear(); race.state = 'lobby'; race.winner = null;
  race.lobbyEnd = time + CONFIG.corridaInscricao;
  race.pending.clear();
  // Quem interagiu depois do fechamento das inscrições entra automaticamente na próxima rodada.
  for (const entrant of queued) raceJoin(entrant.user, entrant.name);
}
function raceJoin(user, name) {
  if (!user || user === 'anon') return null;
  let r = race.map.get(user);
  if (r) return r;
  if (race.state !== 'lobby' || race.racers.length >= CONFIG.maxCorredoras) {
    if (race.pending.size < CONFIG.maxCorredoras) race.pending.set(user, { user, name: short(name || user) });
    return null;
  }
  r = base({ user, name: short(name || user), p: 0, boost: 0, slow: 0, sm: rand(.92, 1.08), cool: 0, size: .5 });
  race.racers.push(r); race.map.set(user, r); return r;
}
function raceBoost(r, sec) { if (r) r.boost = Math.min(18, r.boost + sec); }
function raceUpdate(dt) {
  const n = race.racers.length;
  if (race.state === 'lobby') {
    if (time >= race.lobbyEnd) { if (n >= 2) { race.state = 'countdown'; race.cdEnd = time + 4; } else race.lobbyEnd = time + 10; }
  } else if (race.state === 'countdown') {
    if (time >= race.cdEnd) { race.state = 'run'; race.startedAt = time; banner('🏁 VALENDO!', 'Comenta, curte e manda presente pra acelerar!', '#8ac926'); }
  } else if (race.state === 'run') {
    let lead = null;
    for (const r of race.racers) {
      r.sm = clamp(r.sm + rand(-.6, .6) * dt, .85, 1.15);
      let v = CONFIG.corridaVelocidade * r.sm;

function onGift(e) {

}
function onLike(e) {

  const alreadyQueued = race.pending.has(e.user);

function handle(e) {
  switch (e.type) {
    case 'chat': onChat(e); break;
    case 'gift': onGift(e); break;
    case 'like': onLike(e); break;
    case 'follow': onFollow(e); break;
    case 'share': onShare(e); break;
    case 'status': setStatus(e.text || '', e.ok); break;
  }
}

  else { rot = Math.sin(w) * .12; jump = Math.abs(Math.sin(w)) * 8; }
  if (time < partyUntil) jump += Math.abs(Math.sin(w * 2)) * 10;
  const col = (r.gold || time < goldAllUntil) ? '#e6b422' : r.color;

  ell(-20, -lL, 12, 6, '#1c1c1c'); ell(20, -lR, 12, 6, '#1c1c1c');
  const aL = .2 + .8 * (.5 + .5 * Math.sin(sp)), aR = .2 + .8 * (.5 - .5 * Math.sin(sp));
  ctx.strokeStyle = dark; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(-22, -72); ctx.lineTo(-22 - 32 * Math.cos(aL), -72 - 32 * Math.sin(aL));
  ctx.moveTo(22, -72); ctx.lineTo(22 + 32 * Math.cos(aR), -72 - 32 * Math.sin(aR)); ctx.stroke();
  const an = Math.sin(time * 5 + r.ph * 7) * 8;

  ell(0, -112, 21, 20, light);
  ell(-8, -114, 6.5, 7, '#fff'); ell(8, -114, 6.5, 7, '#fff');
  const px = Math.sin(time * 2 + r.ph * 5) * 1.6;

  } else if (r.hat === 'laco') {

function bunting(y0, amp, off) {

  if (mode === 'arraia') renderArraia(); else renderCorrida();
  for (const p of parts) {
    if (p.k === 'c') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); ctx.restore(); }
    else if (p.k === 'e') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.font = `${p.w}px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(p.txt, 0, 0); ctx.restore(); }
    else { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  }
  if (time < partyUntil) {
    ctx.fillStyle = `hsla(${(time * 140) % 360},90%,60%,${.07 + .05 * Math.abs(Math.sin(Math.PI * beatT * CONFIG.bpm / 60))})`;
    ctx.fillRect(0, 0, W, H);
  }
  drawHeader(mode === 'arraia' ? '🪗 ' + CONFIG.tituloArraia + ' 🪗' : '🏁 ' + CONFIG.tituloCorrida + ' 🏁');
  if (mode === 'arraia') drawFeedAndRank();
  drawHint();
  if (curB) {
    const age = time - curB.t0, a = clamp(Math.min(age / .25, (3.2 - age) / .4), 0, 1), sc = 1 + .12 * (1 - Math.min(1, age / .25));
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, 900); ctx.scale(sc, sc);
    rr(-480, -80, 960, 160, 36, 'rgba(20,10,40,.82)');
    ctx.lineWidth = 6; ctx.strokeStyle = curB.color; rr(-480, -80, 960, 160, 36); ctx.stroke();
    T(curB.t, 0, -22, 44, { c: curB.color, lw: 8 }); T(curB.sub, 0, 36, 32, { st: 0, w: '700' });
    ctx.restore();
  }
}

/* ============================================================
   LOOP
   ============================================================ */
function update(dt) {
  time += dt; beatT += dt;
  for (let i = timers.length - 1; i >= 0; i--) if (time >= timers[i].at) { const f = timers[i].fn; timers.splice(i, 1); f(); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.k === 's') { p.vy += p.g * dt; p.vx *= .985; } else p.r += p.vr * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0 || p.y > H + 80) parts.splice(i, 1);
  }
  if (!curB && banners.length) { curB = banners.shift(); curB.t0 = time; }
  if (curB && time - curB.t0 > 3.2) curB = null;
  if (mode === 'arraia') {
    for (const r of crowd.values()) moveRoach(r, dt);
    for (let i = minis.length - 1; i >= 0; i--) { moveRoach(minis[i], dt); if (time > minis[i].life) minis.splice(i, 1); }
    if (boss && time - boss.t0 > boss.dur) boss = null;
  } else raceUpdate(dt);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}

/* ============================================================
   CONEXÃO COM O SERVIDOR (SSE) + PAINEL
   ============================================================ */
const stEl = document.getElementById('st');
function setStatus(t, ok) { stEl.textContent = (ok ? '🟢 ' : '🟠 ') + t; }
function connect() {
  const base = qs.get('server') || (location.protocol.startsWith('http') ? '' : null);
  if (base === null) { stEl.textContent = '⚪ Modo demo (abra pelo servidor para ligar na live)'; return; }
  const es = new EventSource(base + '/events');
  es.onopen = () => setStatus('Conectado ao servidor', true);
  es.onmessage = ev => { try { handle(JSON.parse(ev.data)); } catch (_) {} };
  es.onerror = () => setStatus('Sem servidor — tentando reconectar…', false);
}

function setMode(m) {
  mode = m; if (m === 'corrida' && !race.racers.length) raceReset();
  document.getElementById('m_arraia').classList.toggle('on', m === 'arraia');
  document.getElementById('m_corrida').classList.toggle('on', m === 'corrida');
}
const NAMES = ['Ana', 'Beto', 'Carla', 'Duda', 'Edu', 'Fabi', 'Gui', 'Helena', 'Igor', 'Jade', 'Kaio', 'Lara', 'Marcos', 'Nina', 'Otávio', 'Paula', 'Rafa', 'Sara', 'Téo', 'Vivi'];
const MSGS = ['forró!', 'tô aqui', '!pular', '!girar', '!cor azul', '!cor rosa', 'bora!', '👏👏', 'salve', 'kkkkk', 'sanfoneiro monstro', '!dancar'];
const sim = {
  user: () => document.getElementById('su').value.trim() || 'Maria',
  chat(u, m) { handle({ type: 'chat', user: u, name: u, text: m }); },
  gift(u, g, d, c) { handle({ type: 'gift', user: u, name: u, gift: g, diamonds: d, count: c || 1 }); },
};
let autoT = null;
function autoTick() {
  const u = pick(NAMES) + ((Math.random() * 6) | 0), r = Math.random();
  if (r < .6) sim.chat(u, pick(MSGS));
  else if (r < .78) handle({ type: 'like', user: u, name: u, likes: (Math.random() * 20 + 5) | 0 });
  else if (r < .9) sim.gift(u, 'Rose', 1, 1 + ((Math.random() * 3) | 0));
  else if (r < .95) handle({ type: 'follow', user: u, name: u });
  else if (r < .985) sim.gift(u, 'Doughnut', 30, 1);
  else sim.gift(u, 'Lion', 500, 1);
}
document.getElementById('m_arraia').onclick = () => setMode('arraia');
document.getElementById('m_corrida').onclick = () => setMode('corrida');
document.getElementById('snd').onclick = () => audioOn ? stopAudio() : startAudio();
document.getElementById('b_chat').onclick = () => sim.chat(sim.user(), document.getElementById('sm').value);
document.getElementById('b_like').onclick = () => handle({ type: 'like', user: sim.user(), name: sim.user(), likes: 50 });
document.getElementById('b_follow').onclick = () => handle({ type: 'follow', user: sim.user(), name: sim.user() });
document.getElementById('b_share').onclick = () => handle({ type: 'share', user: sim.user(), name: sim.user() });
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const [g, d] = b.dataset.g.split('|'); sim.gift(sim.user(), g, +d, 1); });
document.getElementById('b_bots').onclick = () => { for (let i = 0; i < 10; i++) later(i * .12, () => sim.chat(pick(NAMES) + ((Math.random() * 99) | 0), pick(MSGS))); };
document.getElementById('b_auto').onclick = e => {
  if (autoT) { clearInterval(autoT); autoT = null; e.target.classList.remove('on'); e.target.textContent = '▶️ Demo automática'; }
  else { autoT = setInterval(autoTick, 650); e.target.classList.add('on'); e.target.textContent = '⏸️ Parar demo'; }
};
document.getElementById('b_reset').onclick = () => {
  crowd.clear(); minis = []; boss = null; gifters.clear(); feed.length = 0; parts.length = 0; meter.lvl = 0; meter.v = 0;
  partyUntil = 0; goldAllUntil = 0; race.pending.clear(); race.wins.clear(); race.round = 1; raceReset();
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'h' || e.key === 'H') { const p = document.getElementById('panel'); p.style.display = p.style.display === 'none' ? '' : 'none'; }
  if (e.key === 'm' || e.key === 'M') setMode(mode === 'arraia' ? 'corrida' : 'arraia');
});
if (qs.get('panel') === '0') document.getElementById('panel').style.display = 'none';
if (qs.get('som') === '1') {
  try { startAudio(); } catch (_) {}
  addEventListener('pointerdown', () => { if (!audioOn) startAudio(); }, { once: true });
}

raceReset();
setMode(mode);
connect();
requestAnimationFrame(loop);
})();
</script>
